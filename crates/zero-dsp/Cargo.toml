[package]
name = "zero-dsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Digital Signal Processing for Industrial Automation: Butterworth IIR, Moving Average, Kalman Filter, and FFT for ZeroRust"
readme = "README.md"
keywords = ["dsp", "filter", "kalman", "fft", "butterworth"]
categories.workspace = true

[features]
default = ["std"]
std = ["zero-core/std"]

[dependencies]
zero-core = { path = "../zero-core", default-features = false }
libm = { version = "0.2", default-features = false }
