[package]
name = "zero-motion"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Robotics kinematics (6-DOF, SCARA, Cartesian), Jacobians, and 7-phase jerk-limited S-curve motion profile for ZeroRust"
readme = "README.md"
keywords = ["motion-control", "robotics", "kinematics", "s-curve", "trajectory"]
categories.workspace = true

[features]
default = ["std"]
std = ["zero-core/std"]

[dependencies]
zero-core = { path = "../zero-core", default-features = false }
libm = { version = "0.2", default-features = false }
