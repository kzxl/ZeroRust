[package]
name = "zero-simd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Hardware-intrinsic SIMD microkernels, fast math, activations, and quantization routines for ZeroUniverse (no_std capable)"
readme = "README.md"
keywords = ["simd", "avx2", "fma", "fast-math", "quantization"]
categories.workspace = true

[features]
default = ["std"]
std = ["zero-core/std"]

[dependencies]
zero-core = { path = "../zero-core", default-features = false }
