[package]
name = "zero-gateway"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Sovereign, ultra-high-throughput, sub-millisecond API Gateway & L7 reverse proxy in ZeroRust"
readme = "README.md"
keywords = ["gateway", "reverse-proxy", "zero-copy", "trie-routing", "sovereign"]
categories.workspace = true

[features]
default = ["std"]
std = ["zero-core/std"]

[dependencies]
zero-core = { path = "../zero-core", default-features = false }
tokio = { version = "1.43", features = ["net", "rt-multi-thread", "time", "sync", "io-util", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.10"
crossbeam-utils = "0.8"
parking_lot = "0.12"
