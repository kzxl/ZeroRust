[package]
name = "zero-compute"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "High-performance compute substrate, cache-aware schedulers, and device runtime for ZeroUniverse"
readme = "README.md"
keywords = ["compute", "scheduler", "parallel", "numa"]
categories.workspace = true

[lib]
name = "zero_compute_core"
path = "src/lib.rs"

[features]
default = ["std"]
std = ["zero-core/std", "zero-simd/std", "rayon"]

[dependencies]
zero-core = { path = "../zero-core", default-features = false }
zero-simd = { path = "../zero-simd", default-features = false }
rayon = { version = "1.12.0", optional = true }
