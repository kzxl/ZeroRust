[package]
name = "zero-tunnel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Low-latency multiplexed UDP transport, RFC 8489 STUN client, NAT hole punching, and E2EE security for ZConn in ZeroRust"
