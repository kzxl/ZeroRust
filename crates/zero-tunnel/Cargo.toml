keywords = ["p2p", "udp-tunnel", "stun", "nat-traversal", "e2ee"]
categories.workspace = true

[features]
default = ["std"]
std = ["zero-core/std"]

[dependencies]
zero-core = { path = "../zero-core", default-features = false }
